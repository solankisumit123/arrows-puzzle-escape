name: Acquire Unity License File (One-Time Setup)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity License Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        id: get-alf

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v${{ steps.get-alf.outputs.unityVersion }}.alf
          path: ${{ steps.get-alf.outputs.filePath }}
