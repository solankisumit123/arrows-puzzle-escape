name: Build Android APK (Instant Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK 📱
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Android Tools
        run: |
          npm install -g cordova

      - name: Create Cordova Project & Add Web Files
        run: |
          cordova create arrows_app com.arrowspuzzle.escape "ArrowsPuzzle"
          cd arrows_app
          rm -rf www/*
          cp -r ../web/* www/
          cordova platform add android@12.0.1
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowsPuzzle-Debug-APK
          path: arrows_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
