name: Build Android APK (Instant Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK 📱
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Project with Capacitor
        run: |
          mkdir build_app && cd build_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init ArrowsPuzzle com.arrowspuzzle.escape --web-dir ../web
          npx cap add android
          npx cap sync android

          # Build APK with Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowsPuzzle-Debug-APK
          path: build_app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
