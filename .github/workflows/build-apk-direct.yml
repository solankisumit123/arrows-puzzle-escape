name: Build Android APK (Instant Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK 📱
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Android Project with Capacitor
        run: |
          mkdir build_app && cd build_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init ArrowsPuzzle com.arrowspuzzle.escape --web-dir ../web
          npx cap add android
          npx cap sync android

          # Build APK with Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowsPuzzle-Debug-APK
          path: build_app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arrows Puzzle Escape v1.0.${{ github.run_number }}"
          body: "🚀 Direct Android APK Download! Download `app-debug.apk` below and install on your phone."
          files: build_app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
