<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrows Out – Tap to Clear (Official Mobile Game)</title>
<style>
:root {
  --bg-color: #f6eedf;
  --bg-card: #ece2d0;
  --bg-banner: #dfceb2;
  --text-main: #523b28;
  --text-sub: #856d58;
  --accent-gold: #b37d2f;
  --line-main: #4a3525;
  --line-highlight: #0284c7;
  --line-error: #e11d48;
  --drop-active: #38bdf8;
  --drop-empty: #dfd4c2;
  --shadow-color: rgba(82, 59, 40, 0.12);
}

[data-theme="dark"] {
  --bg-color: #1c1815;
  --bg-card: #2b2520;
  --bg-banner: #362e28;
  --text-main: #f3e6d5;
  --text-sub: #a89886;
  --accent-gold: #f59e0b;
  --line-main: #dfd0be;
  --line-highlight: #38bdf8;
  --line-error: #ef4444;
  --drop-active: #38bdf8;
  --drop-empty: #453c34;
  --shadow-color: rgba(0, 0, 0, 0.4);
}

[data-theme="mint"] {
  --bg-color: #eaf5ec;
  --bg-card: #d3ead7;
  --bg-banner: #bfdfc4;
  --text-main: #18421c;
  --text-sub: #457549;
  --accent-gold: #d84315;
  --line-main: #1b5e20;
  --line-highlight: #0284c7;
  --line-error: #c62828;
  --drop-active: #00bcd4;
  --drop-empty: #c4d7c7;
  --shadow-color: rgba(24, 66, 28, 0.12);
}

[data-theme="rose"] {
  --bg-color: #fcecef;
  --bg-card: #f7d4dc;
  --bg-banner: #ebbfc8;
  --text-main: #571626;
  --text-sub: #873e51;
  --accent-gold: #c2185b;
  --line-main: #450a18;
  --line-highlight: #0284c7;
  --line-error: #e11d48;
  --drop-active: #ec4899;
  --drop-empty: #e2c7ce;
  --shadow-color: rgba(87, 22, 38, 0.12);
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background-color 0.25s ease;
}

#app {
  width: 100%;
  max-width: 440px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 50px rgba(0,0,0,0.06);
}

/* Header */
header {
  padding: 14px 18px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-main);
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s;
}
.icon-btn:active { transform: scale(0.88); }

.level-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Water Drops / Lives Bar */
.lives-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 22px 10px;
}

.water-drop {
  width: 16px;
  height: 23px;
  background: var(--drop-active);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  transform: rotate(-45deg);
  box-shadow: 0 2px 5px rgba(56,189,248,0.3);
  transition: background-color 0.25s, transform 0.25s;
}

.water-drop.lost {
  background: var(--drop-empty);
  transform: rotate(-45deg) scale(0.82);
  box-shadow: none;
}

/* Canvas Area */
#canvas-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 6px 12px;
}

#game-canvas {
  width: 100%;
  height: 100%;
  max-width: 410px;
  max-height: 450px;
  touch-action: none;
  cursor: pointer;
}

/* Tutorial / Hand cursor prompt */
.hand-prompt {
  position: absolute;
  pointer-events: none;
  font-size: 38px;
  animation: tapFinger 1.2s infinite ease-in-out;
  display: none;
  z-index: 20;
}
@keyframes tapFinger {
  0%, 100% { transform: scale(1) translate(0, 0); }
  50% { transform: scale(0.85) translate(4px, 4px); }
}

/* Floating Action Buttons */
.controls-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 34px;
  padding: 10px 16px;
}

.circle-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid rgba(0,0,0,0.06);
  color: var(--text-main);
  box-shadow: 0 6px 18px var(--shadow-color);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
}

.circle-btn:active {
  transform: scale(0.9);
  box-shadow: 0 2px 6px var(--shadow-color);
}

.badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: #ef4444;
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
}

/* Bottom Textured Kraft Banner */
.bottom-banner {
  background: var(--bg-banner);
  padding: 18px 12px;
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  color: var(--text-main);
  letter-spacing: 2.5px;
  border-top: 1px solid rgba(0,0,0,0.06);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
}

/* Modals */
.modal {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.52);
  backdrop-filter: blur(5px);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 100;
}
.modal.active { display: flex; animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

.card {
  background: var(--bg-color);
  color: var(--text-main);
  border-radius: 24px;
  padding: 28px 22px;
  width: 100%;
  max-width: 350px;
  text-align: center;
  box-shadow: 0 20px 45px rgba(0,0,0,0.25);
}
.card h2 { font-size: 26px; color: var(--accent-gold); margin-bottom: 8px; font-weight: 900; }

.btn-primary {
  background: var(--accent-gold);
  color: #fff;
  border: none;
  padding: 15px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: 800;
  width: 100%;
  cursor: pointer;
  margin-top: 14px;
  box-shadow: 0 5px 15px rgba(179, 125, 47, 0.35);
  transition: transform 0.12s;
}
.btn-primary:active { transform: scale(0.96); }

.levels-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-height: 280px;
  overflow-y: auto;
  margin: 16px 0;
}
.lvl-btn {
  background: var(--bg-card);
  border: none;
  color: var(--text-main);
  padding: 12px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}
.lvl-btn.active { background: var(--accent-gold); color: #fff; }

/* Confetti particles canvas */
#confetti-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 90;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  playEscape() {
    this.init();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(540, t);
    osc.frequency.exponentialRampToValueAtTime(1080, t + 0.18);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  },
  playThud() {
    this.init();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.linearRampToValueAtTime(40, t + 0.14);
    gain.gain.setValueAtTime(0.35, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.14);
    osc.start(t); osc.stop(t + 0.14);
  },
  playWin() {
    this.init();
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t + i * 0.09);
      g.gain.setValueAtTime(0.22, t + i * 0.09);
      g.gain.linearRampToValueAtTime(0.01, t + i * 0.09 + 0.3);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.3);
    });
  }
};

      { id: 16, pts: [[28,88], [72,88]], dir: [1, 0] }
    ]
  }
];

// --- Confetti FX ---
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
let particles = [];

function fireConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  particles = [];
  const colors = ['#f59e0b', '#38bdf8', '#ef4444', '#10b981', '#a855f7'];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 16 - 4,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rot: Math.random() * Math.PI,
      vrot: (Math.random() - 0.5) * 0.2
    });
  }
  animateConfetti();
}

function animateConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.4;
    p.rot += p.vrot;
    p.alpha -= 0.015;

    cctx.save();
    cctx.globalAlpha = Math.max(0, p.alpha);
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    cctx.restore();
  });
  particles = particles.filter(p => p.alpha > 0);
  if (particles.length > 0) requestAnimationFrame(animateConfetti);
}

// --- Game State & Execution ---
let currentLevelIndex = 0;
let lives = 5;
let hints = 3;
let activeLines = [];
let animLines = [];
let errorLine = null;
let errorTimer = 0;
let hintLineId = null;
const themes = ["parchment", "dark", "mint", "rose"];
let currentTheme = 0;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const wrapper = document.getElementById('canvas-wrapper');
  const rect = wrapper.getBoundingClientRect();
  const sz = Math.min(rect.width, rect.height, 420);
  canvas.width = sz * window.devicePixelRatio;
  canvas.height = sz * window.devicePixelRatio;
  canvas.style.width = sz + "px";
  canvas.style.height = sz + "px";
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  render();
}
window.addEventListener('resize', resize);

function loadLevel(idx) {
  currentLevelIndex = (idx + LEVELS.length) % LEVELS.length;
  const data = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));

  lives = 5;
  hintLineId = null;
  document.getElementById('level-title').innerText = `Level ${data.level}`;
  document.getElementById('bottom-banner').innerText = data.banner;
  updateLives();

  activeLines = data.lines.map(l => ({
    ...l,
    animT: 0,
    isEscaping: false
  }));

  hideHand();
  render();
}

function updateLives() {
  const bar = document.getElementById('lives-bar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'water-drop' + (i >= lives ? ' lost' : '');
    bar.appendChild(d);
  }
}

// Raycast: Can arrow escape forward without colliding with any other line?
function canEscape(line) {
  const head = line.pts[line.pts.length - 1];
  const [dx, dy] = line.dir;
  const rayStart = head;
  const rayEnd = [head[0] + dx * 260, head[1] + dy * 260];

  for (let other of activeLines) {
    if (other.id === line.id || other.isEscaping) continue;
    for (let i = 0; i < other.pts.length - 1; i++) {
      if (segmentsCross(rayStart, rayEnd, other.pts[i], other.pts[i + 1])) {
        return false;
      }
    }
  }
  return true;
}

function segmentsCross(a, b, c, d) {
  function ccw(p1, p2, p3) {
    return (p3[1] - p1[1]) * (p2[0] - p1[0]) > (p2[1] - p1[1]) * (p3[0] - p1[0]);
  }
  return (ccw(a,c,d) !== ccw(b,c,d)) && (ccw(a,b,c) !== ccw(a,b,d));
}

function distToSegment(p, a, b) {
  const l2 = (b[0]-a[0])**2 + (b[1]-a[1])**2;
  if (l2 === 0) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t = ((p[0]-a[0])*(b[0]-a[0]) + (p[1]-a[1])*(b[1]-a[1])) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + t*(b[0]-a[0])), p[1] - (a[1] + t*(b[1]-a[1])));
}

function getClickedLine(nx, ny) {
  let closest = null;
  let minDist = 6.5;
  for (let line of activeLines) {
    if (line.isEscaping) continue;
    for (let i = 0; i < line.pts.length - 1; i++) {
      const d = distToSegment([nx, ny], line.pts[i], line.pts[i+1]);
      if (d < minDist) {
        minDist = d;
        closest = line;
      }
    }
  }
  return closest;
}

function onCanvasTap(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX || (e.touches && e.touches[0].clientX);
  const cy = e.clientY || (e.touches && e.touches[0].clientY);
  const x = ((cx - rect.left) / rect.width) * 100;
  const y = ((cy - rect.top) / rect.height) * 100;

  const target = getClickedLine(x, y);
  if (!target) return;

  hideHand();

  if (canEscape(target)) {
    // Escapes smoothly!
    AudioEngine.playEscape();
    target.isEscaping = true;
    animLines.push(target);
    if (hintLineId === target.id) hintLineId = null;
  } else {
    // Blocked!
    AudioEngine.playThud();
    errorLine = target;
    errorTimer = Date.now() + 320;
    lives--;
    updateLives();

    if (lives <= 0) {
      setTimeout(() => document.getElementById('gameover-modal').classList.add('active'), 320);
    }
  }
}

canvas.addEventListener('click', onCanvasTap);

// Animation Render Loop
function render() {
  const sz = canvas.width / window.devicePixelRatio;
  ctx.clearRect(0, 0, sz, sz);

  const style = getComputedStyle(document.body);
  const lineCol = style.getPropertyValue('--line-main').trim();
  const highlightCol = style.getPropertyValue('--line-highlight').trim();
  const errorCol = style.getPropertyValue('--line-error').trim();

  // Active lines
  activeLines.forEach(l => {
    if (l.isEscaping) return;
    let col = lineCol;
    if (l.id === hintLineId) col = highlightCol;
    if (errorLine && errorLine.id === l.id && Date.now() < errorTimer) col = errorCol;
    drawPolyLine(l, col, sz);
  });

  // Animating lines
  for (let i = animLines.length - 1; i >= 0; i--) {
    const l = animLines[i];
    l.animT += 0.085;

    const offset = l.animT * 130;
    const [dx, dy] = l.dir;
    const shifted = {
      ...l,
      pts: l.pts.map(p => [p[0] + dx * offset, p[1] + dy * offset])
    };

    drawPolyLine(shifted, highlightCol, sz, Math.max(0, 1 - l.animT));

    if (l.animT >= 1) {
      animLines.splice(i, 1);
      activeLines = activeLines.filter(item => item.id !== l.id);

      // Win check
      if (activeLines.length === 0) {
        AudioEngine.playWin();
        fireConfetti();
        setTimeout(() => document.getElementById('win-modal').classList.add('active'), 300);
      }
    }
  }

  requestAnimationFrame(render);
}

function drawPolyLine(line, col, sz, alpha = 1) {
  if (line.pts.length < 2) return;
  const s = sz / 100;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(line.pts[0][0] * s, line.pts[0][1] * s);
  for (let i = 1; i < line.pts.length; i++) {
    ctx.lineTo(line.pts[i][0] * s, line.pts[i][1] * s);
  }
  ctx.stroke();

  // Arrow Head
  const head = line.pts[line.pts.length - 1];
  const [dx, dy] = line.dir;
  const hx = head[0] * s;
  const hy = head[1] * s;
  const angle = Math.atan2(dy, dx);
  const arrowL = 8.5;

  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx - arrowL * Math.cos(angle - Math.PI/6), hy - arrowL * Math.sin(angle - Math.PI/6));
  ctx.lineTo(hx - arrowL * Math.cos(angle + Math.PI/6), hy - arrowL * Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function showHandOn(line) {
  const prompt = document.getElementById('hand-prompt');
  const head = line.pts[line.pts.length - 1];
  const rect = canvas.getBoundingClientRect();
  prompt.style.left = (rect.left + (head[0]/100)*rect.width - 20) + 'px';
  prompt.style.top = (rect.top + (head[1]/100)*rect.height - 20) + 'px';
  prompt.style.display = 'block';
}

function hideHand() {
  document.getElementById('hand-prompt').style.display = 'none';
}

// UI Wiring
document.getElementById('btn-next').onclick = () => {
  document.getElementById('win-modal').classList.remove('active');
  loadLevel(currentLevelIndex + 1);
};

document.getElementById('btn-retry').onclick = () => {
  document.getElementById('gameover-modal').classList.remove('active');
  loadLevel(currentLevelIndex);
};

document.getElementById('btn-hint').onclick = () => {
  if (hints <= 0) return;
  const free = activeLines.find(l => !l.isEscaping && canEscape(l));
  if (free) {
    hintLineId = free.id;
    showHandOn(free);
    hints--;
    document.getElementById('hint-badge').innerText = hints;
  }
};

document.getElementById('btn-theme').onclick = () => {
  currentTheme = (currentTheme + 1) % themes.length;
  const t = themes[currentTheme];
  if (t === "parchment") document.body.removeAttribute('data-theme');
  else document.body.setAttribute('data-theme', t);
};

document.getElementById('btn-prev').onclick = () => loadLevel(currentLevelIndex - 1);

document.getElementById('btn-levels').onclick = () => {
  const g = document.getElementById('levels-grid');
  g.innerHTML = '';
  LEVELS.forEach((lvl, i) => {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn' + (i === currentLevelIndex ? ' active' : '');
    btn.innerText = `Lvl ${lvl.level}`;
    btn.onclick = () => {
      document.getElementById('levels-modal').classList.remove('active');
      loadLevel(i);
    };
    g.appendChild(btn);
  });
  document.getElementById('levels-modal').classList.add('active');
};
document.getElementById('btn-close-levels').onclick = () => document.getElementById('levels-modal').classList.remove('active');

// Initialize & Launch
resize();
loadLevel(0); // Starts on Level 40 Puppy matching Screenshot 1!
</script>
