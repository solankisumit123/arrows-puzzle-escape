<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Arrows Out – Tap to Clear</title>
<style>
:root {
  --bg-color: #f5eedc;
  --bg-card: #e8deca;
  --bg-banner: #dfd0b5;
  --text-primary: #543d2b;
  --text-muted: #8c735d;
  --accent-gold: #b88235;
  --line-color: #4a3528;
  --line-highlight: #0284c7;
  --line-error: #dc2626;
  --drop-active: #38bdf8;
  --drop-lost: #dfd5c4;
}

[data-theme="dark"] {
  --bg-color: #1a1715;
  --bg-card: #27221f;
  --bg-banner: #332d29;
  --text-primary: #ebdcc9;
  --text-muted: #9e9182;
  --accent-gold: #f59e0b;
  --line-color: #d8c7b5;
  --line-highlight: #38bdf8;
  --line-error: #ef4444;
  --drop-active: #38bdf8;
  --drop-lost: #443c35;
}

[data-theme="mint"] {
  --bg-color: #eaf4ec;
  --bg-card: #d3e8d6;
  --bg-banner: #c2dec6;
  --text-primary: #1e4620;
  --text-muted: #4e7a51;
  --accent-gold: #e65100;
  --line-color: #1b5e20;
  --line-highlight: #0284c7;
  --line-error: #d32f2f;
  --drop-active: #00bcd4;
  --drop-lost: #c8d6c9;
}

[data-theme="rose"] {
  --bg-color: #fbeef2;
  --bg-card: #f5d3dc;
  --bg-banner: #ebbfc9;
  --text-primary: #5c1d2e;
  --text-muted: #8c4357;
  --accent-gold: #c2185b;
  --line-color: #4a1525;
  --line-highlight: #0284c7;
  --line-error: #e11d48;
  --drop-active: #ec4899;
  --drop-lost: #e2c9cf;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background-color 0.3s ease;
}

#app {
  width: 100%;
  max-width: 440px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
header {
  padding: 14px 18px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-primary);
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}
.icon-btn:active { transform: scale(0.9); }

.level-title {
  font-size: 23px;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Water Drops / Lives Bar */
.lives-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 22px 10px;
}

.water-drop {
  width: 16px;
  height: 22px;
  background: var(--drop-active);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  transform: rotate(-45deg);
  box-shadow: 0 2px 4px rgba(56,189,248,0.25);
  transition: background-color 0.25s, transform 0.25s;
}

.water-drop.lost {
  background: var(--drop-lost);
  transform: rotate(-45deg) scale(0.85);
  box-shadow: none;
}

/* Canvas Area */
#canvas-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 6px 12px;
}

#puzzle-canvas {
  width: 100%;
  height: 100%;
  max-width: 400px;
  max-height: 440px;
  touch-action: none;
  cursor: pointer;
}

/* Floating Action Buttons */
.controls-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 32px;
  padding: 10px 16px;
}

.circle-btn {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid rgba(0,0,0,0.06);
  color: var(--text-primary);
  box-shadow: 0 5px 15px rgba(84, 61, 43, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
}

.circle-btn:active {
  transform: scale(0.92);
  box-shadow: 0 2px 6px rgba(84, 61, 43, 0.1);
}

.badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: #ef4444;
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
}

/* Bottom Textured Kraft Banner */
.bottom-banner {
  background: var(--bg-banner);
  padding: 18px 12px;
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  color: var(--text-primary);
  letter-spacing: 2px;
  border-top: 1px solid rgba(0,0,0,0.06);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
}

/* Modals */
.modal {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 100;
}
.modal.active { display: flex; animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

.card {
  background: var(--bg-color);
  color: var(--text-primary);
  border-radius: 22px;
  padding: 26px 22px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  box-shadow: 0 16px 36px rgba(0,0,0,0.2);
}
.card h2 { font-size: 24px; color: var(--accent-gold); margin-bottom: 8px; font-weight: 900; }

.btn-primary {
  background: var(--accent-gold);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 28px;
  font-size: 16px;
  font-weight: 800;
  width: 100%;
  cursor: pointer;
  margin-top: 14px;
  box-shadow: 0 4px 12px rgba(184, 130, 53, 0.3);
}
.btn-primary:active { transform: scale(0.96); }

.levels-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-height: 260px;
  overflow-y: auto;
  margin: 14px 0;
}
.lvl-btn {
  background: var(--bg-card);
  border: none;
  color: var(--text-primary);
  padding: 10px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
}
.lvl-btn.active { background: var(--accent-gold); color: #fff; }

@keyframes pop {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<script>
// --- Audio Synthesizer ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playAudio(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'escape') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(1040, now + 0.16);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
    osc.start(now); osc.stop(now + 0.18);
  } else if (type === 'thud') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.linearRampToValueAtTime(50, now + 0.12);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now + i * 0.08);
      g.gain.setValueAtTime(0.25, now + i * 0.08);
      g.gain.linearRampToValueAtTime(0.01, now + i * 0.08 + 0.28);
      o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.28);
    });
  }
}

// --- Procedural Level Data ---
function getLevel(lvl) {
  const idx = (lvl - 1) % SILHOUETTE_LEVELS.length;
  const base = JSON.parse(JSON.stringify(SILHOUETTE_LEVELS[idx]));
  return base;
}

// --- Game State ---
let currentLvl = 10;
let lives = 5;
let hints = 3;
let activeLines = [];
let animLines = [];
let errorLine = null;
let errorTimeout = 0;
let hintLineId = null;
const themes = ["parchment", "dark", "mint", "rose"];
let currentTheme = 0;

const canvas = document.getElementById('puzzle-canvas');
const ctx = canvas.getContext('2d');

function initCanvas() {
  const container = document.getElementById('canvas-container');
  const rect = container.getBoundingClientRect();
  const sz = Math.min(rect.width, rect.height, 420);
  canvas.width = sz * window.devicePixelRatio;
  canvas.height = sz * window.devicePixelRatio;
  canvas.style.width = sz + "px";
  canvas.style.height = sz + "px";
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  render();
}

window.addEventListener('resize', initCanvas);

function startLevel(lvl) {
  currentLvl = lvl;
  lives = 5;
  hintLineId = null;
  document.getElementById('level-title').innerText = `Level ${lvl}`;
  updateLives();

  const data = getLevel(lvl);
  document.getElementById('bottom-banner').innerText = data.banner || "TAP TO CLEAR";

  activeLines = data.lines.map(l => ({
    ...l,
    animT: 0,
    isEscaping: false
  }));

  render();
}

function updateLives() {
  const bar = document.getElementById('lives-bar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'water-drop' + (i >= lives ? ' lost' : '');
    bar.appendChild(d);
  }
}

// Raycast & Segment Intersection Check
function canEscape(line) {
  const head = line.pts[line.pts.length - 1];
  const [dx, dy] = line.dir;
  const rayStart = head;
  const rayEnd = [head[0] + dx * 250, head[1] + dy * 250];

  for (let other of activeLines) {
    if (other.id === line.id || other.isEscaping) continue;
    for (let i = 0; i < other.pts.length - 1; i++) {
      const p1 = other.pts[i];
      const p2 = other.pts[i + 1];
      if (lineIntersect(rayStart, rayEnd, p1, p2)) {
        return false; // Intersects another line!
      }
    }
  }
  return true;
}

function lineIntersect(a, b, c, d) {
  function ccw(p1, p2, p3) {
    return (p3[1] - p1[1]) * (p2[0] - p1[0]) > (p2[1] - p1[1]) * (p3[0] - p1[0]);
  }
  return (ccw(a,c,d) !== ccw(b,c,d)) && (ccw(a,b,c) !== ccw(a,b,d));
}

function pointToSegDist(p, a, b) {
  const l2 = (b[0]-a[0])**2 + (b[1]-a[1])**2;
  if (l2 === 0) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t = ((p[0]-a[0])*(b[0]-a[0]) + (p[1]-a[1])*(b[1]-a[1])) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + t*(b[0]-a[0])), p[1] - (a[1] + t*(b[1]-a[1])));
}

function findClickedLine(nx, ny) {
  let closest = null;
  let minDist = 6;
  for (let line of activeLines) {
    if (line.isEscaping) continue;
    for (let i = 0; i < line.pts.length - 1; i++) {
      const d = pointToSegDist([nx, ny], line.pts[i], line.pts[i+1]);
      if (d < minDist) {
        minDist = d;
        closest = line;
      }
    }
  }
  return closest;
}

function handleTap(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX || (e.touches && e.touches[0].clientX);
  const cy = e.clientY || (e.touches && e.touches[0].clientY);
  const x = ((cx - rect.left) / rect.width) * 100;
  const y = ((cy - rect.top) / rect.height) * 100;

  const target = findClickedLine(x, y);
  if (!target) return;

  if (canEscape(target)) {
    // Escapes!
    playAudio('escape');
    target.isEscaping = true;
    animLines.push(target);
    if (hintLineId === target.id) hintLineId = null;
  } else {
    // Blocked!
    playAudio('thud');
    errorLine = target;
    errorTimeout = Date.now() + 300;
    lives--;
    updateLives();

    if (lives <= 0) {
      setTimeout(() => document.getElementById('gameover-modal').classList.add('active'), 300);
    }
  }
}

canvas.addEventListener('click', handleTap);

// Render loop
function render() {
  const sz = canvas.width / window.devicePixelRatio;
  ctx.clearRect(0, 0, sz, sz);

  const style = getComputedStyle(document.body);
  const lineCol = style.getPropertyValue('--line-color').trim();
  const highlightCol = style.getPropertyValue('--line-highlight').trim();
  const errorCol = style.getPropertyValue('--line-error').trim();

  // Active lines
  activeLines.forEach(l => {
    if (l.isEscaping) return;
    let col = lineCol;
    if (l.id === hintLineId) col = highlightCol;
    if (errorLine && errorLine.id === l.id && Date.now() < errorTimeout) col = errorCol;
    drawPoly(l, col, sz);
  });

  // Animating escape lines
  for (let i = animLines.length - 1; i >= 0; i--) {
    const l = animLines[i];
    l.animT += 0.08;

    const offset = l.animT * 120;
    const [dx, dy] = l.dir;
    const shifted = {
      ...l,
      pts: l.pts.map(p => [p[0] + dx * offset, p[1] + dy * offset])
    };

    drawPoly(shifted, highlightCol, sz, Math.max(0, 1 - l.animT));

    if (l.animT >= 1) {
      animLines.splice(i, 1);
      activeLines = activeLines.filter(item => item.id !== l.id);

      if (activeLines.length === 0) {
        playAudio('win');
        setTimeout(() => document.getElementById('win-modal').classList.add('active'), 300);
      }
    }
  }

  requestAnimationFrame(render);
}

function drawPoly(line, col, sz, opacity = 1) {
  if (line.pts.length < 2) return;
  const scale = sz / 100;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(line.pts[0][0] * scale, line.pts[0][0] * scale); // Initial point
  ctx.moveTo(line.pts[0][0] * scale, line.pts[0][1] * scale);
  for (let i = 1; i < line.pts.length; i++) {
    ctx.lineTo(line.pts[i][0] * scale, line.pts[i][1] * scale);
  }
  ctx.stroke();

  // Arrowhead
  const head = line.pts[line.pts.length - 1];
  const [dx, dy] = line.dir;
  const hx = head[0] * scale;
  const hy = head[1] * scale;
  const angle = Math.atan2(dy, dx);
  const arrowL = 8.5;

  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx - arrowL * Math.cos(angle - Math.PI/6), hy - arrowL * Math.sin(angle - Math.PI/6));
  ctx.lineTo(hx - arrowL * Math.cos(angle + Math.PI/6), hy - arrowL * Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// UI Buttons
document.getElementById('btn-next').onclick = () => {
  document.getElementById('win-modal').classList.remove('active');
  startLevel(currentLvl + 1);
};

document.getElementById('btn-retry').onclick = () => {
  document.getElementById('gameover-modal').classList.remove('active');
  startLevel(currentLvl);
};

document.getElementById('btn-hint').onclick = () => {
  if (hints <= 0) return;
  const free = activeLines.find(l => !l.isEscaping && canEscape(l));
  if (free) {
    hintLineId = free.id;
    hints--;
    document.getElementById('hint-badge').innerText = hints;
  }
};

document.getElementById('btn-theme').onclick = () => {
  currentTheme = (currentTheme + 1) % themes.length;
  const t = themes[currentTheme];
  if (t === "parchment") document.body.removeAttribute('data-theme');
  else document.body.setAttribute('data-theme', t);
};

document.getElementById('btn-levels').onclick = () => {
  const g = document.getElementById('levels-grid');
  g.innerHTML = '';
  for (let i = 1; i <= 20; i++) {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn' + (i === currentLvl ? ' active' : '');
    btn.innerText = `${i}`;
    btn.onclick = () => {
      document.getElementById('levels-modal').classList.remove('active');
      startLevel(i);
    };
    g.appendChild(btn);
  }
  document.getElementById('levels-modal').classList.add('active');
};
document.getElementById('btn-close-levels').onclick = () => document.getElementById('levels-modal').classList.remove('active');

document.getElementById('btn-prev').onclick = () => {
  if (currentLvl > 1) startLevel(currentLvl - 1);
};

// Start
initCanvas();
startLevel(10); // Start on Level 10 (Trophy 🏆) like screenshot!
</script>
</body>
</html>
